name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/**

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Ruff
        id: ruff
        continue-on-error: true
        run: set -o pipefail; ruff check app tests scripts 2>&1 | tee ruff.log
      - name: Pytest
        id: pytest
        continue-on-error: true
        run: set -o pipefail; pytest 2>&1 | tee pytest.log
      - name: Upload backend logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-validation-logs
          path: |
            backend/ruff.log
            backend/pytest.log
      - name: Enforce backend result
        if: steps.ruff.outcome == 'failure' || steps.pytest.outcome == 'failure'
        run: exit 1

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install dependencies
        run: npm install
      - name: Build
        id: build
        continue-on-error: true
        run: set -o pipefail; npm run build 2>&1 | tee build.log
      - name: Validate service worker syntax
        id: service-worker
        continue-on-error: true
        run: set -o pipefail; node --check public/sw.js 2>&1 | tee service-worker.log
      - name: Upload frontend logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-validation-logs
          path: |
            frontend/build.log
            frontend/service-worker.log
      - name: Enforce frontend result
        if: steps.build.outcome == 'failure' || steps.service-worker.outcome == 'failure'
        run: exit 1
