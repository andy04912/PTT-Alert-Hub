name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/**
      - fix/**

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Compile backend
        run: python -m compileall app scripts
      - name: Pytest
        run: pytest

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Node.js
        run: node --version && npm --version
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Validate service worker syntax
        run: node --check public/sw.js
