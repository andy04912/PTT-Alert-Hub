<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <title>PTT Alert Hub｜目前離線</title>
    <style>
      :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #f7f8fc; background: #111827; }
      * { box-sizing: border-box; }
      body { display: grid; min-width: 320px; min-height: 100dvh; margin: 0; padding: max(28px, env(safe-area-inset-top)) max(22px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(22px, env(safe-area-inset-left)); place-items: center; background: radial-gradient(circle at 80% 15%, rgba(124, 126, 248, 0.3), transparent 30%), radial-gradient(circle at 12% 90%, rgba(44, 182, 125, 0.16), transparent 30%), #111827; }
      main { width: min(100%, 520px); padding: 34px; border: 1px solid rgba(255,255,255,.12); border-radius: 24px; background: rgba(255,255,255,.07); box-shadow: 0 30px 80px rgba(0,0,0,.26); backdrop-filter: blur(18px); }
      .mark { display: grid; width: 58px; height: 58px; place-items: center; border-radius: 17px; background: linear-gradient(135deg,#7c7ef8,#5557d9); box-shadow: 0 12px 28px rgba(75,77,211,.36); font-size: 28px; font-weight: 900; }
      h1 { margin: 28px 0 10px; font-size: clamp(28px,7vw,42px); letter-spacing: -.04em; }
      p { margin: 0; color: #b6c0d2; line-height: 1.75; }
      button { width: 100%; min-height: 48px; margin-top: 28px; border: 0; border-radius: 13px; color: white; background: #5b5ce2; font: inherit; font-weight: 800; cursor: pointer; }
      small { display:block; margin-top:16px; color:#8994a9; line-height:1.6; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">P</div>
      <h1>目前沒有網路連線</h1>
      <p>PTT Alert Hub 的 App 外殼仍可開啟，但規則、命中紀錄與文章資料需要連線後才能更新。</p>
      <button type="button" onclick="window.location.reload()">重新連線</button>
      <small>網路恢復後，系統會繼續使用原本的登入狀態。</small>
    </main>
    <script>window.addEventListener('online', () => window.location.reload());</script>
  </body>
</html>
