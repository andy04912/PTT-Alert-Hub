[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "ptt-alert-hub-backend"
version = "0.4.0"
description = "PTT 定時爬蟲、規則比對與 Telegram 通知服務"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "apscheduler>=3.11.3,<4",
  "beautifulsoup4>=4.13,<5",
  "fastapi[standard]>=0.139.2,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pyjwt>=2.10,<3",
  "pydantic-settings>=2.14.2,<3",
  "sqlalchemy>=2.0.51,<3",
  "tzdata>=2026.3",
  "uvicorn[standard]>=0.51,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.setuptools.packages.find]
include = ["app*"]
