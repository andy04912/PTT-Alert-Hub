services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ptt_alert_hub}
      POSTGRES_USER: ${POSTGRES_USER:-ptt_alert_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-database-password}
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ptt_alert_hub} -d ${POSTGRES_DB:-ptt_alert_hub}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ptt_alert_hub}:${POSTGRES_PASSWORD:-change-me-database-password}@database:5432/${POSTGRES_DB:-ptt_alert_hub}
      TZ: Asia/Taipei
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "8000"
    ports:
      - "8000:8000"

  crawler-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ptt_alert_hub}:${POSTGRES_PASSWORD:-change-me-database-password}@database:5432/${POSTGRES_DB:-ptt_alert_hub}
      TZ: Asia/Taipei
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: 8000
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      - "8080:80"

volumes:
  database-data:
